<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCC + Strong's Numbers — AI Review</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #333;
  display: flex; flex-direction: column; }

header {
  background: linear-gradient(135deg, #1a237e, #283593);
  color: #fff; padding: 6px 24px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px;
}
header h1 { font-size: 1.1em; font-weight: 600; }
#stats { font-size: 0.8em; opacity: 0.85; }

#lang-select {
  background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3);
  border-radius: 4px; padding: 3px 6px; font-size: 0.85em; cursor: pointer;
}
#lang-select option { color: #333; background: #fff; }

/* Auth controls in header */
#auth-area { display: flex; align-items: center; gap: 8px; }
#auth-btn {
  background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.4);
  border-radius: 4px; padding: 4px 10px; font-size: 0.82em; cursor: pointer;
}
#auth-btn:hover { background: rgba(255,255,255,0.3); }
#reviewer-badge {
  font-size: 0.82em; background: rgba(76,175,80,0.3); border-radius: 4px;
  padding: 3px 8px; display: none;
}
#logout-btn {
  background: none; border: none; color: rgba(255,255,255,0.7); font-size: 0.78em;
  cursor: pointer; text-decoration: underline;
}

/* Auth modal */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
  background: #fff; border-radius: 8px; padding: 28px; max-width: 400px; width: 90%;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}
.modal h2 { font-size: 1.1em; margin-bottom: 16px; color: #1a237e; }
.modal label { display: block; font-size: 0.85em; color: #555; margin-bottom: 4px; }
.modal input {
  width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px;
  font-size: 0.95em; margin-bottom: 12px;
}
.modal button {
  padding: 8px 18px; border: none; border-radius: 4px; cursor: pointer;
  font-size: 0.9em; font-weight: 600;
}
.modal .btn-primary { background: #1a237e; color: #fff; }
.modal .btn-primary:hover { background: #283593; }
.modal .btn-primary:disabled { background: #9e9e9e; cursor: not-allowed; }
.modal .btn-cancel { background: #eee; color: #555; margin-left: 8px; }
.modal .auth-msg { font-size: 0.85em; margin-top: 8px; padding: 6px; border-radius: 4px; }
.modal .auth-msg.info { background: #e3f2fd; color: #1565c0; }
.modal .auth-msg.error { background: #ffcdd2; color: #c62828; }
.modal .auth-msg.success { background: #c8e6c9; color: #2e7d32; }

.controls {
  background: #fff; padding: 4px 24px; border-bottom: 1px solid #ddd; flex-shrink: 0;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.controls label { font-size: 0.85em; color: #555; }
.controls select {
  padding: 5px 8px; border: 1px solid #bbb; border-radius: 4px;
  font-size: 0.95em; min-width: 120px;
}

/* Brand tabs */
.brand-tabs { display: flex; gap: 4px; margin-right: 8px; }
.brand-tab {
  padding: 4px 12px; border: 1px solid #bbb; border-radius: 14px;
  font-size: 0.82em; font-weight: 600; cursor: pointer;
  background: #f5f5f5; color: #555; transition: all 0.15s;
}
.brand-tab:hover { background: #e0e0e0; }
.brand-tab.active { color: #fff; border-color: transparent; }
.brand-tab[data-brand="claude"].active { background: #7c4dff; }
.brand-tab[data-brand="gemini"].active { background: #1a73e8; }
.brand-tab[data-brand="codex"].active { background: #2e7d32; }

/* Main content area: panels + handle + notes in a flex column */
.main-area {
  display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden;
}
.panels {
  display: flex; flex: 1; gap: 0; min-height: 120px; overflow: hidden;
}
.panel {
  flex: 1; display: flex; flex-direction: column; border-right: 1px solid #ddd;
  min-width: 0;
}
.panel:last-child { border-right: none; }
.panel-header {
  padding: 3px 16px; font-weight: 600; font-size: 0.85em;
  border-bottom: 1px solid #e0e0e0; flex-shrink: 0;
}
.panel-header.left { background: #e8eaf6; color: #1a237e; }
.panel-header.right { background: #e0f2f1; color: #00695c; }

.panel-content {
  flex: 1; overflow-y: auto; padding: 12px 16px; background: #fff;
}

.verse {
  margin: 0 0 8px; padding: 6px 8px; border-radius: 4px;
  line-height: 1.7; font-size: 1.05em; cursor: pointer;
  transition: background 0.15s;
}
.verse:hover { background: #f5f5f5; }
.verse.selected { background: #fff9c4; }

.verse-num {
  font-weight: 700; color: #1565c0; margin-right: 4px;
  font-size: 0.85em; vertical-align: super;
}

.sn {
  color: #2e7d32; font-size: 0.78em; cursor: pointer;
  padding: 0 1px; border-radius: 2px; transition: background 0.15s;
}
.sn:hover { text-decoration: underline; }
.sn.highlight { background: #ffeb3b; color: #333; font-weight: 600; }

.confidence {
  display: inline-block; font-size: 0.7em; padding: 1px 5px;
  border-radius: 8px; margin-left: 6px; font-weight: 600; vertical-align: middle;
}
.confidence.high { background: #c8e6c9; color: #2e7d32; }
.confidence.medium { background: #fff9c4; color: #f57f17; }
.confidence.low { background: #ffcdd2; color: #c62828; }

.model-tag {
  font-size: 0.7em; padding: 1px 5px; border-radius: 4px;
  background: #e3f2fd; color: #1565c0; margin-left: 4px; vertical-align: middle;
}

.empty-state {
  text-align: center; padding: 60px 20px; color: #999; font-size: 1.1em;
}

.lcc-original {
  display: block; font-size: 0.82em; color: #888; margin-top: 2px;
  font-style: italic;
}

/* Review badge on verses */
.review-badge {
  display: inline-block; font-size: 0.68em; padding: 1px 5px;
  border-radius: 8px; margin-left: 4px; font-weight: 600;
  vertical-align: middle; background: #e3f2fd; color: #1565c0;
}
.review-badge.has-approval { background: #c8e6c9; color: #2e7d32; }
.review-badge.has-needs-work { background: #ffcdd2; color: #c62828; }

/* Resize handle between panels and notes */
.resize-handle {
  height: 14px; background: #1b5e20; cursor: ns-resize; flex-shrink: 0;
  border-radius: 4px; margin: 1px auto;
  width: 120px; user-select: none; touch-action: none;
}
.resize-handle::before {
  content: '↕'; display: block; text-align: center; color: #fff;
  font-size: 12px; font-weight: bold; line-height: 14px;
  text-shadow: 0 0 2px rgba(0,0,0,0.4);
  -webkit-text-stroke: 2px #fff;
}
.resize-handle:hover { background: #2e7d32; width: 180px; }
.resize-handle:active { background: #2e7d32; width: 180px; }

/* Notes + reviews bottom panel */
.notes-panel {
  background: #fafafa; border-top: 1px solid #ddd; padding: 10px 24px;
  font-size: 0.85em; flex: 0 0 30vh; min-height: 60px; overflow-y: auto;
}
.notes-panel summary {
  cursor: pointer; font-weight: 600; color: #555; user-select: none;
}
.notes-panel .note { margin: 4px 0; padding: 3px 0; color: #666; border-bottom: 1px solid #eee; }
.notes-panel .note:last-child { border-bottom: none; }

/* Reviews section inside notes panel */
.reviews-section { margin-top: 10px; padding-top: 8px; border-top: 1px solid #ddd; }
.reviews-section h4 { font-size: 0.92em; color: #1565c0; margin: 0 0 6px; }

.review-entry {
  margin: 5px 0; padding: 6px 8px; background: #f8f9fa;
  border-radius: 4px; border-left: 3px solid #90a4ae;
}
.review-entry.type-approval { border-left-color: #4caf50; }
.review-entry.type-needs_work { border-left-color: #f44336; }
.review-entry.type-suggestion { border-left-color: #ff9800; }
.review-entry.type-comment { border-left-color: #2196f3; }

.review-meta { font-size: 0.8em; color: #888; margin-bottom: 2px; }
.review-type-badge {
  display: inline-block; font-size: 0.75em; padding: 0 4px;
  border-radius: 3px; font-weight: 600; margin-right: 4px;
}
.review-type-badge.approval { background: #c8e6c9; color: #2e7d32; }
.review-type-badge.needs_work { background: #ffcdd2; color: #c62828; }
.review-type-badge.suggestion { background: #fff3e0; color: #e65100; }
.review-type-badge.comment { background: #e3f2fd; color: #1565c0; }

.review-text { font-size: 0.88em; color: #444; margin-top: 2px; }
.review-entry.own { cursor: pointer; }
.review-entry.own:hover { background: #e8eaf6; }
.review-entry.editing { outline: 2px solid #1a237e; background: #e8eaf6; }
.review-actions { float: right; }
.review-actions button {
  background: none; border: none; cursor: pointer; font-size: 0.78em;
  color: #999; padding: 0 3px;
}
.review-actions button:hover { color: #c62828; }
.review-bar .cancel-btn {
  padding: 5px 10px; background: #eee; color: #555; border: none;
  border-radius: 4px; cursor: pointer; font-size: 0.85em;
}

/* Review form bar — below controls, only when authenticated */
.review-bar {
  background: #e8eaf6; padding: 4px 24px; border-bottom: 1px solid #c5cae9; flex-shrink: 0;
  display: none; flex-wrap: wrap; gap: 6px; align-items: center;
}
.review-bar.active { display: flex; }
.review-bar label { font-size: 0.82em; color: #333; display: flex; align-items: center; gap: 4px; }
.review-bar select, .review-bar textarea {
  padding: 4px 6px; border: 1px solid #bbb; border-radius: 3px; font-size: 0.85em;
}
.review-bar textarea { min-height: 32px; resize: vertical; flex: 1; min-width: 200px; }
.review-bar .verse-ref {
  font-weight: 600; color: #1a237e; font-size: 0.85em; min-width: 80px;
}
.review-bar button {
  padding: 5px 14px; background: #1a237e; color: #fff; border: none;
  border-radius: 4px; cursor: pointer; font-size: 0.85em; font-weight: 600;
}
.review-bar button:hover { background: #283593; }
.review-bar button:disabled { background: #9e9e9e; cursor: not-allowed; }
#review-type option[value="comment"]    { background: #e3f2fd; color: #1565c0; }
#review-type option[value="suggestion"] { background: #fff3e0; color: #e65100; }
#review-type option[value="approval"]   { background: #c8e6c9; color: #2e7d32; }
#review-type option[value="needs_work"] { background: #ffcdd2; color: #c62828; }
</style>
</head>
<body>

<header>
  <h1 id="title"></h1>
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <div id="stats"></div>
    <div id="auth-area">
      <span id="reviewer-badge"></span>
      <button id="auth-btn" onclick="showAuthModal()"></button>
      <button id="logout-btn" onclick="logout()" style="display:none"></button>
    </div>
    <select id="lang-select">
      <option value="zh-Hant">正體中文</option>
      <option value="en">English</option>
      <option value="zh-Hans">简体中文</option>
    </select>
  </div>
</header>

<!-- Auth Modal -->
<div class="modal-overlay" id="auth-modal">
  <div class="modal">
    <h2 id="auth-modal-title"></h2>
    <!-- Step 1: Email + Name -->
    <div id="auth-step-email">
      <label id="auth-label-name"></label>
      <input type="text" id="auth-name" maxlength="50">
      <label id="auth-label-email"></label>
      <input type="email" id="auth-email">
      <button class="btn-primary" id="auth-request-btn" onclick="requestAccess()"></button>
      <button class="btn-cancel" onclick="hideAuthModal()"></button>
    </div>
    <!-- Step 2: OTP -->
    <div id="auth-step-otp" style="display:none">
      <label id="auth-label-otp"></label>
      <input type="text" id="auth-otp" maxlength="6" pattern="[0-9]{6}" inputmode="numeric">
      <button class="btn-primary" id="auth-verify-btn" onclick="verifyOTP()"></button>
      <button class="btn-cancel" onclick="hideAuthModal()"></button>
    </div>
    <!-- Step 3: Pending approval — close button -->
    <div id="auth-pending-close" style="display:none;text-align:center;margin-top:12px">
      <button class="btn-primary" onclick="hideAuthModal()" style="min-width:120px" data-i18n="closePending"></button>
    </div>
    <div id="auth-msg" class="auth-msg" style="display:none"></div>
  </div>
</div>

<div class="controls">
  <label><span data-i18n="version"></span> <select id="version-select"></select></label>
  <div class="brand-tabs" id="brand-tabs"></div>
  <label><span data-i18n="book"></span> <select id="book-select"><option>Loading...</option></select></label>
  <label><span data-i18n="chapter"></span> <select id="chap-select"><option>—</option></select></label>
</div>

<div class="review-bar" id="review-bar">
  <span class="verse-ref" id="review-verse-ref">—</span>
  <label>
    <span data-i18n="reviewType"></span>
    <select id="review-type">
      <option value="comment"></option>
      <option value="suggestion"></option>
      <option value="approval"></option>
      <option value="needs_work"></option>
    </select>
  </label>
  <textarea id="review-text" maxlength="2000" rows="1" placeholder=""></textarea>
  <button id="review-submit-btn" onclick="submitReview()"></button>
  <button class="cancel-btn" id="review-cancel-btn" onclick="cancelEditReview()" style="display:none"></button>
</div>

<div class="main-area" id="main-area">
  <div class="panels" id="panels">
    <div class="panel">
      <div class="panel-header left" id="left-header"></div>
      <div class="panel-content" id="left-content">
        <div class="empty-state">Select a book and chapter</div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header right" id="right-header"></div>
      <div class="panel-content" id="right-content">
        <div class="empty-state">Select a book and chapter</div>
      </div>
    </div>
  </div>

  <div class="resize-handle" id="resize-handle"></div>

  <details class="notes-panel" id="notes-panel">
    <summary id="notes-summary"></summary>
    <div id="notes-content"></div>
    <div class="reviews-section" id="reviews-section">
      <h4 id="reviews-header"></h4>
      <div id="reviews-list"></div>
    </div>
  </details>
</div>

// ngrok free tier intercepts fetch() with an interstitial page unless this header is set
const FETCH_OPTS = { headers: { 'ngrok-skip-browser-warning': '1' } };

  const h = { 'ngrok-skip-browser-warning': '1' };
  if (sessionToken) h['Authorization'] = `Bearer ${sessionToken}`;

let lang = localStorage.getItem('showoff_lang') || 'zh-Hant';
function t(key) { return I18N[lang][key]; }

// ── State ────────────────────────────────────────────────────────────────

let manifest = null;
let bundle = null;
let booksData = [];
let bookMap = {};
let currentVersion = localStorage.getItem('showoff_target_version') || null;
let currentBrand = null;
let currentData = null;
let currentBook = null;
let currentChap = null;
let selectedVerseSec = null;

// Version display names
const VERSION_NAMES = {
  lcc: '呂振中譯本',
  rcuv2010: '和合本2010',
  tcv: '現代中文譯本',
  esv: 'ESV',
  nasb: 'NASB',
};
function versionDisplayName(ver) {
  return VERSION_NAMES[ver] || ver.toUpperCase();
}

// Auth state
let sessionToken = localStorage.getItem('showoff_session_token') || null;
let currentReviewer = null; // {email, name}
let reviewCache = {};       // "Book/Chap" -> [review, ...]
let pendingAuthEmail = null;
let editingReviewId = null;  // review ID being edited

const bookSelect = document.getElementById('book-select');
const chapSelect = document.getElementById('chap-select');
const leftContent = document.getElementById('left-content');
const rightContent = document.getElementById('right-content');
const notesContent = document.getElementById('notes-content');
const statsEl = document.getElementById('stats');
const langSelect = document.getElementById('lang-select');

// ── Startup ──────────────────────────────────────────────────────────────

async function init() {
  langSelect.value = lang;
  langSelect.addEventListener('change', onLangChange);

  try {
    const [bundleResp, booksResp] = await Promise.all([
      fetch(BUNDLE_URL, FETCH_OPTS),
      fetch(BOOKS_URL, FETCH_OPTS)
    ]);
    bundle = await bundleResp.json();
    booksData = await booksResp.json();
    booksData.forEach(b => { bookMap[b.eng] = b; });

    // Version-aware bundle: { versions: { lcc: { brands: { claude: { manifest, verses } } } } }
    if (bundle.versions) {
      const versions = Object.keys(bundle.versions);
      if (!currentVersion || !versions.includes(currentVersion)) {
        currentVersion = versions.includes('lcc') ? 'lcc' : versions[0];
      }
      renderVersionSelect(versions);
      const versionData = bundle.versions[currentVersion];
      const brands = Object.keys(versionData.brands);
      currentBrand = brands.includes('claude') ? 'claude' : brands[0];
      manifest = versionData.brands[currentBrand].manifest;
      renderBrandTabs(brands);
    } else if (bundle.brands) {
      // Legacy brand-only format: { brands: { claude: { manifest, verses }, ... } }
      currentVersion = 'lcc';
      const brands = Object.keys(bundle.brands);
      currentBrand = brands.includes('claude') ? 'claude' : brands[0];
      manifest = bundle.brands[currentBrand].manifest;
      renderBrandTabs(brands);
    } else {
      // Legacy flat format: { manifest, verses }
      currentVersion = 'lcc';
      manifest = bundle.manifest;
      currentBrand = 'claude';
    }

    applyI18n();
    populateBookSelect();
    showStats();
  } catch (e) {
    applyI18n();
    leftContent.innerHTML = `<div class="empty-state">${t('errorLoad')}<br><code>cd llm_direct_sn_unv2notyet && python generate_manifest.py && python generate_data_bundle.py</code></div>`;
    rightContent.innerHTML = leftContent.innerHTML;
  }

  // Check existing session
  if (sessionToken) {
    await checkAuthStatus();
  }
  updateAuthUI();
}

function onLangChange() {
  lang = langSelect.value;
  localStorage.setItem('showoff_lang', lang);
  document.documentElement.lang = lang === 'zh-Hans' ? 'zh-Hans' : lang === 'zh-Hant' ? 'zh-Hant' : 'en';
  applyI18n();
  if (manifest) {
    const savedBook = bookSelect.value;
    const savedChap = chapSelect.value;
    populateBookSelect(savedBook);
    if (savedChap && chapSelect.querySelector(`option[value="${savedChap}"]`)) {
      chapSelect.value = savedChap;
    }
    showStats();
  }
  if (currentData) {
    renderVerses(currentData, currentBook, currentChap);
    if (currentBook && currentChap) updateVerseBadges();
  }
}

function applyI18n() {
  document.getElementById('title').textContent = t('title');
  document.getElementById('left-header').textContent = t('leftHeader');
  document.getElementById('right-header').textContent = t('rightHeader')(versionDisplayName(currentVersion || 'lcc'));
  document.getElementById('notes-summary').textContent = t('notesSummary');
  document.getElementById('reviews-header').textContent = t('reviewsHeader');
  document.getElementById('review-submit-btn').textContent = t('submit');
  document.getElementById('auth-btn').textContent = t('enterReviewMode');
  document.getElementById('logout-btn').textContent = t('logout');
  document.getElementById('auth-modal-title').textContent = t('authTitle');
  document.getElementById('auth-label-name').textContent = t('labelName');
  document.getElementById('auth-label-email').textContent = t('labelEmail');
  document.getElementById('auth-request-btn').textContent = t('requestAccess');
  document.getElementById('auth-label-otp').textContent = t('labelOTP');
  document.getElementById('auth-verify-btn').textContent = t('verify');
  // Cancel buttons
  document.querySelectorAll('.btn-cancel').forEach(b => b.textContent = t('cancel'));
  // data-i18n elements
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  // Review bar type options + tooltips + placeholder
  const typeSelect = document.getElementById('review-type');
  if (typeSelect) {
    const opts = [
      { text: t('typeComment'),    tip: t('tipComment') },
      { text: t('typeSuggestion'), tip: t('tipSuggestion') },
      { text: t('typeApproval'),   tip: t('tipApproval') },
      { text: t('typeNeedsWork'),  tip: t('tipNeedsWork') },
    ];
    for (let i = 0; i < opts.length; i++) {
      typeSelect.options[i].textContent = opts[i].text;
      typeSelect.options[i].title = opts[i].tip;
    }
    updateTypeSelectColor(typeSelect);
  }
  const reviewTextarea = document.getElementById('review-text');
  if (reviewTextarea) reviewTextarea.placeholder = t('reviewPlaceholder');
  if (!selectedVerseSec) {
    notesContent.innerHTML = `<em>${t('noVerse')}</em>`;
    document.getElementById('reviews-list').innerHTML = '';
  }
  leftContent.querySelectorAll('.empty-state').forEach(el => {
    if (el.textContent.trim() && !el.querySelector('code')) el.textContent = t('emptyState');
  });
  rightContent.querySelectorAll('.empty-state').forEach(el => {
    if (el.textContent.trim() && !el.querySelector('code')) el.textContent = t('emptyState');
  });
}

const TYPE_COLORS = {
  comment:    { bg: '#e3f2fd', fg: '#1565c0' },
  suggestion: { bg: '#fff3e0', fg: '#e65100' },
  approval:   { bg: '#c8e6c9', fg: '#2e7d32' },
  needs_work: { bg: '#ffcdd2', fg: '#c62828' },
};

function updateTypeSelectColor(sel) {
  const c = TYPE_COLORS[sel.value] || TYPE_COLORS.comment;
  sel.style.background = c.bg;
  sel.style.color = c.fg;
  sel.style.fontWeight = '600';
}

// Attach color-change listener once
document.getElementById('review-type')?.addEventListener('change', function() {
  updateTypeSelectColor(this);
});

function showStats() {
  let totalVerses = 0, totalLow = 0, totalBooks = Object.keys(manifest.books).length;
  for (const book of Object.values(manifest.books)) {
    for (const ch of Object.values(book.chapters)) {
      totalVerses += ch.verses.length;
      totalLow += (ch.low_confidence || []).length;
    }
  }
  statsEl.textContent = t('stats')(totalBooks, totalVerses, totalVerses - totalLow, totalLow);
}

function renderVersionSelect(versions) {
  const sel = document.getElementById('version-select');
  sel.innerHTML = '';
  for (const ver of versions) {
    const opt = document.createElement('option');
    opt.value = ver;
    opt.textContent = `${versionDisplayName(ver)} (${ver})`;
    sel.appendChild(opt);
  }
  sel.value = currentVersion;
  if (versions.length <= 1) sel.parentElement.style.display = 'none';
  if (!sel._listening) {
    sel.addEventListener('change', onVersionChange);
    sel._listening = true;
  }
}

function onVersionChange() {
  const ver = document.getElementById('version-select').value;
  if (ver === currentVersion) return;
  currentVersion = ver;
  localStorage.setItem('showoff_target_version', ver);
  const versionData = bundle.versions[ver];
  const brands = Object.keys(versionData.brands);
  currentBrand = brands.includes(currentBrand) ? currentBrand :
                 brands.includes('claude') ? 'claude' : brands[0];
  manifest = versionData.brands[currentBrand].manifest;
  renderBrandTabs(brands);
  selectedVerseSec = null;
  reviewCache = {};
  notesContent.innerHTML = `<em>${t('noVerse')}</em>`;
  document.getElementById('reviews-list').innerHTML = '';
  applyI18n();
  populateBookSelect();
  showStats();
}

function renderBrandTabs(brands) {
  const container = document.getElementById('brand-tabs');
  container.innerHTML = '';
  if (brands.length <= 1) return; // no tabs needed for single brand
  for (const brand of brands) {
    const tab = document.createElement('span');
    tab.className = 'brand-tab' + (brand === currentBrand ? ' active' : '');
    tab.dataset.brand = brand;
    tab.textContent = brand;
    tab.addEventListener('click', () => onBrandChange(brand));
    container.appendChild(tab);
  }
}

function onBrandChange(brand) {
  if (brand === currentBrand) return;
  currentBrand = brand;
  const src = bundle.versions ? bundle.versions[currentVersion].brands[brand] :
              bundle.brands ? bundle.brands[brand] : bundle;
  manifest = src.manifest;
  // Update tab active state
  document.querySelectorAll('.brand-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.brand === brand);
  });
  // Reset selection
  selectedVerseSec = null;
  reviewCache = {};
  notesContent.innerHTML = `<em>${t('noVerse')}</em>`;
  document.getElementById('reviews-list').innerHTML = '';
  populateBookSelect();
  showStats();
}

// ── Auth ─────────────────────────────────────────────────────────────────

function updateAuthUI() {
  const btn = document.getElementById('auth-btn');
  const badge = document.getElementById('reviewer-badge');
  const logoutBtn = document.getElementById('logout-btn');
  const reviewBar = document.getElementById('review-bar');

  if (currentReviewer) {
    btn.style.display = 'none';
    badge.style.display = 'inline-block';
    badge.textContent = currentReviewer.name;
    logoutBtn.style.display = 'inline';
    reviewBar.classList.add('active');
  } else {
    btn.style.display = 'inline-block';
    badge.style.display = 'none';
    logoutBtn.style.display = 'none';
    reviewBar.classList.remove('active');
  }
}

async function checkAuthStatus() {
  try {
    const resp = await fetch('/api/auth/status', authFetchOpts());
    if (!resp.ok) { clearSession(); return; }
    const data = await resp.json();
    if (data.authenticated) {
      currentReviewer = data.reviewer;
    } else {
      clearSession();
    }
  } catch {
    // Server might not be running the review server — silently ignore
    clearSession();
  }
}

function clearSession() {
  sessionToken = null;
  currentReviewer = null;
  localStorage.removeItem('showoff_session_token');
}

function logout() {
  // Soft logout: clear in-memory state but keep token in localStorage for auto-login within 7 days
  sessionToken = null;
  currentReviewer = null;
  updateAuthUI();
}

async function showAuthModal() {
  // Try auto-login with stored token first
  const savedToken = localStorage.getItem('showoff_session_token');
  if (savedToken) {
    sessionToken = savedToken;
    await checkAuthStatus();
    if (currentReviewer) {
      updateAuthUI();
      return; // Auto-login succeeded, no modal needed
    }
    // Token expired or invalid — remove it and show modal
    localStorage.removeItem('showoff_session_token');
  }

  const savedName = localStorage.getItem('showoff_auth_name');
  const savedEmail = localStorage.getItem('showoff_auth_email');
  const wasPending = localStorage.getItem('showoff_pending_approval');

  // Only auto-retry if user previously got "pending_approval" and is waiting for admin
  if (wasPending && savedName && savedEmail) {
    try {
      const resp = await fetch('/api/auth/request-access', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': '1' },
        body: JSON.stringify({ email: savedEmail, name: savedName }),
      });
      const data = await resp.json();
      if (data.status === 'otp_sent') {
        // Admin approved — jump straight to OTP step
        localStorage.removeItem('showoff_pending_approval');
        pendingAuthEmail = savedEmail;
        document.getElementById('auth-modal').classList.add('active');
        document.getElementById('auth-step-email').style.display = 'none';
        document.getElementById('auth-step-otp').style.display = 'block';
        document.getElementById('auth-pending-close').style.display = 'none';
        showAuthMsg(t('otpSent'), 'success');
        document.getElementById('auth-otp').focus();
        return;
      }
    } catch {}
  }

  document.getElementById('auth-modal').classList.add('active');
  document.getElementById('auth-step-email').style.display = 'block';
  document.getElementById('auth-step-otp').style.display = 'none';
  document.getElementById('auth-pending-close').style.display = 'none';
  document.getElementById('auth-msg').style.display = 'none';
  if (savedName) document.getElementById('auth-name').value = savedName;
  if (savedEmail) document.getElementById('auth-email').value = savedEmail;
}

function hideAuthModal() {
  document.getElementById('auth-modal').classList.remove('active');
}

function showAuthMsg(text, cls) {
  const el = document.getElementById('auth-msg');
  el.innerHTML = escHtml(text).replace(/\n/g, '<br>');
  el.className = `auth-msg ${cls}`;
  el.style.display = 'block';
}

async function requestAccess() {
  const name = document.getElementById('auth-name').value.trim();
  const email = document.getElementById('auth-email').value.trim();
  if (!name || !email) return;

  localStorage.setItem('showoff_auth_name', name);
  localStorage.setItem('showoff_auth_email', email);
  pendingAuthEmail = email;

  const btn = document.getElementById('auth-request-btn');
  btn.disabled = true;

  try {
    const resp = await fetch('/api/auth/request-access', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': '1' },
      body: JSON.stringify({ email, name }),
    });
    const data = await resp.json();

    if (data.status === 'otp_sent') {
      showAuthMsg(t('otpSent'), 'success');
      document.getElementById('auth-step-email').style.display = 'none';
      document.getElementById('auth-step-otp').style.display = 'block';
      document.getElementById('auth-otp').focus();
    } else if (data.status === 'pending_approval') {
      localStorage.setItem('showoff_pending_approval', '1');
      showAuthMsg(t('pendingApproval'), 'info');
      // Hide form, show only the message + close button
      document.getElementById('auth-step-email').style.display = 'none';
      document.getElementById('auth-step-otp').style.display = 'none';
      document.getElementById('auth-pending-close').style.display = 'block';
    } else {
      showAuthMsg(data.error || 'Error', 'error');
    }
  } catch (e) {
    showAuthMsg('Network error: ' + e.message, 'error');
  }
  btn.disabled = false;
}

async function verifyOTP() {
  const otp = document.getElementById('auth-otp').value.trim();
  if (!otp || !pendingAuthEmail) return;

  const btn = document.getElementById('auth-verify-btn');
  btn.disabled = true;

  try {
    const resp = await fetch('/api/auth/verify-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': '1' },
      body: JSON.stringify({ email: pendingAuthEmail, otp }),
    });
    const data = await resp.json();

    if (data.token) {
      sessionToken = data.token;
      currentReviewer = data.reviewer;
      localStorage.setItem('showoff_session_token', sessionToken);
      localStorage.removeItem('showoff_pending_approval');
      showAuthMsg(t('authSuccess'), 'success');
      setTimeout(() => {
        hideAuthModal();
        updateAuthUI();
      }, 800);
    } else {
      showAuthMsg(t('invalidOTP'), 'error');
    }
  } catch (e) {
    showAuthMsg('Network error: ' + e.message, 'error');
  }
  btn.disabled = false;
}

// ── Reviews API ─────────────────────────────────────────────────────────

async function fetchReviews(book, chap) {
  const cacheKey = `${currentVersion}/${currentBrand}/${book}/${chap}`;
  try {
    const brandParam = currentBrand ? `&brand=${currentBrand}` : '';
    const versionParam = currentVersion ? `&version=${currentVersion}` : '';
    const resp = await fetch(`/api/reviews?book=${book}&chap=${chap}${brandParam}${versionParam}`, FETCH_OPTS);
    if (resp.ok) {
      const data = await resp.json();
      reviewCache[cacheKey] = data.reviews || [];
    } else {
      reviewCache[cacheKey] = [];
    }
  } catch {
    if (!reviewCache[cacheKey]) reviewCache[cacheKey] = [];
  }
  return reviewCache[cacheKey];
}

function getVerseReviews(book, chap, sec) {
  return (reviewCache[`${currentVersion}/${currentBrand}/${book}/${chap}`] || []).filter(r => r.sec === sec);
}

function getChapterReviewCounts(book, chap) {
  const all = reviewCache[`${currentVersion}/${currentBrand}/${book}/${chap}`] || [];
  const counts = {};
  for (const r of all) {
    if (!counts[r.sec]) counts[r.sec] = { total: 0, hasApproval: false, hasNeedsWork: false };
    counts[r.sec].total++;
    if (r.type === 'approval') counts[r.sec].hasApproval = true;
    if (r.type === 'needs_work') counts[r.sec].hasNeedsWork = true;
  }
  return counts;
}

function updateVerseBadges() {
  const counts = getChapterReviewCounts(currentBook, parseInt(currentChap));
  document.querySelectorAll('#right-content .verse[data-sec]').forEach(el => {
    el.querySelectorAll('.review-badge').forEach(b => b.remove());
    const sec = parseInt(el.dataset.sec);
    const info = counts[sec];
    if (info && info.total > 0) {
      const badge = document.createElement('span');
      let cls = 'review-badge';
      if (info.hasApproval) cls += ' has-approval';
      else if (info.hasNeedsWork) cls += ' has-needs-work';
      badge.className = cls;
      const icon = info.hasApproval ? '\u2713' : info.hasNeedsWork ? '\u2717' : '\uD83D\uDCAC';
      badge.textContent = `${icon}${info.total}`;
      badge.title = t('reviewCount')(info.total);
      const confEl = el.querySelector('.confidence');
      if (confEl) confEl.after(badge);
    }
  });
}

function showVerseReviews(book, chap, sec) {
  const reviews = getVerseReviews(book, chap, sec);
  const listEl = document.getElementById('reviews-list');
  const typeKeys = {
    comment: 'typeComment', suggestion: 'typeSuggestion',
    approval: 'typeApproval', needs_work: 'typeNeedsWork'
  };

  if (reviews.length === 0) {
    listEl.innerHTML = `<em>${t('noReviews')}</em>`;
  } else {
    const myEmail = currentReviewer?.email;
    listEl.innerHTML = reviews.map(r => {
      const typeKey = typeKeys[r.type] || 'typeComment';
      const ts = new Date(r.timestamp).toLocaleString();
      const isOwn = myEmail && r.reviewer_email === myEmail;
      const ownCls = isOwn ? ' own' : '';
      const editCls = editingReviewId === r.id ? ' editing' : '';
      const actions = isOwn ? `<span class="review-actions">
        <button onclick="event.stopPropagation();deleteReview('${r.id}')" title="${t('deleteReview')}">✕</button>
      </span>` : '';
      return `<div class="review-entry type-${r.type}${ownCls}${editCls}" data-rid="${r.id}"
        ${isOwn ? `onclick="loadReviewForEdit('${r.id}')" title="${t('editHint')}"` : ''}>
        <div class="review-meta">
          ${actions}
          <span class="review-type-badge ${r.type}">${t(typeKey)}</span>
          <strong>${escHtml(r.reviewer_name)}</strong> &mdash; ${ts}
        </div>
        ${r.text ? `<div class="review-text">${escHtml(r.text)}</div>` : ''}
      </div>`;
    }).join('');
  }
}

async function submitReview() {
  if (!currentReviewer || !selectedVerseSec) return;

  const btn = document.getElementById('review-submit-btn');
  btn.disabled = true;

  // If editing, delete old review first
  if (editingReviewId) {
    try {
      await fetch(`/api/reviews?id=${editingReviewId}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${sessionToken}`, 'ngrok-skip-browser-warning': '1' },
      });
      // Remove from cache
      const cacheKey = `${currentVersion}/${currentBrand}/${currentBook}/${currentChap}`;
      if (reviewCache[cacheKey]) {
        reviewCache[cacheKey] = reviewCache[cacheKey].filter(r => r.id !== editingReviewId);
      }
    } catch (e) {
      console.error('Delete old review error:', e);
    }
  }

  const body = {
    version: currentVersion,
    brand: currentBrand,
    book: currentBook,
    chap: parseInt(currentChap),
    sec: selectedVerseSec,
    type: document.getElementById('review-type').value,
    text: document.getElementById('review-text').value.trim(),
  };

  try {
    const resp = await fetch('/api/reviews', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${sessionToken}`,
        'ngrok-skip-browser-warning': '1',
      },
      body: JSON.stringify(body),
    });

    if (resp.ok) {
      const newReview = await resp.json();
      const cacheKey = `${currentVersion}/${currentBrand}/${currentBook}/${currentChap}`;
      if (!reviewCache[cacheKey]) reviewCache[cacheKey] = [];
      reviewCache[cacheKey].push(newReview);
      showVerseReviews(currentBook, parseInt(currentChap), selectedVerseSec);
      updateVerseBadges();
      cancelEditReview();
    } else {
      const err = await resp.json();
      if (err.error === 'Authentication required') {
        clearSession();
        updateAuthUI();
      }
    }
  } catch (e) {
    console.error('Review submit error:', e);
  }
  btn.disabled = false;
}

function loadReviewForEdit(reviewId) {
  if (!currentReviewer) return;
  const cacheKey = `${currentVersion}/${currentBrand}/${currentBook}/${currentChap}`;
  const review = (reviewCache[cacheKey] || []).find(r => r.id === reviewId);
  if (!review || review.reviewer_email !== currentReviewer.email) return;

  editingReviewId = reviewId;

  // Populate review bar
  const typeSelect = document.getElementById('review-type');
  typeSelect.value = review.type;
  updateTypeSelectColor(typeSelect);
  document.getElementById('review-text').value = review.text || '';

  // Switch button labels
  document.getElementById('review-submit-btn').textContent = t('update');
  document.getElementById('review-cancel-btn').style.display = 'inline-block';
  document.getElementById('review-cancel-btn').textContent = t('cancelEdit');

  // Highlight the entry being edited
  showVerseReviews(currentBook, parseInt(currentChap), selectedVerseSec);
}

function cancelEditReview() {
  editingReviewId = null;
  document.getElementById('review-text').value = '';
  document.getElementById('review-type').value = 'comment';
  updateTypeSelectColor(document.getElementById('review-type'));
  document.getElementById('review-submit-btn').textContent = t('submit');
  document.getElementById('review-cancel-btn').style.display = 'none';

  // Remove editing highlight
  if (selectedVerseSec) {
    showVerseReviews(currentBook, parseInt(currentChap), selectedVerseSec);
  }
}

async function deleteReview(reviewId) {
  if (!confirm(t('confirmDelete'))) return;

  try {
    const resp = await fetch(`/api/reviews?id=${reviewId}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${sessionToken}`, 'ngrok-skip-browser-warning': '1' },
    });
    if (resp.ok) {
      const cacheKey = `${currentVersion}/${currentBrand}/${currentBook}/${currentChap}`;
      if (reviewCache[cacheKey]) {
        reviewCache[cacheKey] = reviewCache[cacheKey].filter(r => r.id !== reviewId);
      }
      if (editingReviewId === reviewId) cancelEditReview();
      showVerseReviews(currentBook, parseInt(currentChap), selectedVerseSec);
      updateVerseBadges();
    }
  } catch (e) {
    console.error('Delete review error:', e);
  }
}

// ── Dropdowns ────────────────────────────────────────────────────────────

function populateBookSelect(restoreValue) {
  bookSelect.innerHTML = '';
  for (const b of booksData) {
    if (!manifest.books[b.eng]) continue;
    const opt = document.createElement('option');
    opt.value = b.eng;
    opt.textContent = t('bookName')(b);
    bookSelect.appendChild(opt);
  }
  if (restoreValue && bookSelect.querySelector(`option[value="${restoreValue}"]`)) {
    bookSelect.value = restoreValue;
  }
  if (!bookSelect._listenersAttached) {
    bookSelect.addEventListener('change', onBookChange);
    chapSelect.addEventListener('change', onChapChange);
    bookSelect._listenersAttached = true;
  }
  if (bookSelect.options.length > 0) onBookChange();
}

function onBookChange() {
  const book = bookSelect.value;
  const bookData = manifest.books[book];
  if (!bookData) return;

  chapSelect.innerHTML = '';
  const chapters = Object.keys(bookData.chapters).map(Number).sort((a, b) => a - b);
  for (const ch of chapters) {
    const opt = document.createElement('option');
    opt.value = ch;
    const count = bookData.chapters[String(ch)].verses.length;
    opt.textContent = t('chapLabel')(ch, count);
    chapSelect.appendChild(opt);
  }
  if (chapters.length > 0) onChapChange();
}

async function onChapChange() {
  const book = bookSelect.value;
  const chap = chapSelect.value;
  if (!book || !chap) return;

  currentBook = book;
  currentChap = chap;

  const cacheKey = `${book}/${chap}`;
  const brandData = bundle.versions ? bundle.versions[currentVersion].brands[currentBrand] :
                    bundle.brands ? bundle.brands[currentBrand] : bundle;
  const data = (brandData.verses || {})[cacheKey] || [];
  currentData = data;
  renderVerses(data, book, chap);

  // Fetch reviews for this chapter
  await fetchReviews(book, parseInt(chap));
  updateVerseBadges();
}

// ── Render ────────────────────────────────────────────────────────────────

function parseSN(text) {
  if (!text) return '';
  let r = text;
  r = r.replace(/\{<W[A-Z]*([HG])(\d+)>\}/g, (_, l, n) => snSpan(l, n));
  r = r.replace(/<W[A-Z]*([HG])(\d+)>/g, (_, l, n) => snSpan(l, n));
  r = r.replace(/\{([HG])(\d+)\}/g, (_, l, n) => snSpan(l, n));
  r = r.replace(/\(([HG])(\d+)\)/g, (_, l, n) => snSpan(l, n));
  return r;
}

function snSpan(lang, num) {
  const id = `${lang}${num}`;
  return `<span class="sn" data-strong="${id}" title="Strong's ${id}">&lt;${id}&gt;</span>`;
}

function confidenceClass(c) {
  if (c >= 0.85) return 'high';
  if (c >= 0.70) return 'medium';
  return 'low';
}

function renderVerses(data, book, chap) {
  const info = bookMap[book];
  const bookLabel = info ? t('bookName')(info) : book;
  const ver = currentVersion || 'lcc';
  const verName = versionDisplayName(ver);
  const snField = `${ver}_sn`;
  const origField = `${ver}_original`;

  let leftHtml = `<h3 style="margin:0 0 10px;font-size:1em;color:#1a237e">${t('chapHeadingLeft')(bookLabel, chap)}</h3>`;
  let rightHtml = `<h3 style="margin:0 0 10px;font-size:1em;color:#00695c">${t('chapHeadingRight')(bookLabel, chap, verName)}</h3>`;

  for (const v of data) {
    const sec = v.sec;
    const cls = confidenceClass(v.confidence);
    const pct = (v.confidence * 100).toFixed(0);
    const modelTag = v.model ? `<span class="model-tag">${v.model}</span>` : '';
    // Dynamic field access: try version-specific, fallback to lcc_sn for legacy data
    const targetSN = v[snField] || v.lcc_sn || '';
    const targetOrig = v[origField] || v.lcc_original || '';

    leftHtml += `<p class="verse" data-sec="${sec}">`;
    leftHtml += `<span class="verse-num">${sec}</span> `;
    leftHtml += parseSN(v.unv_sn_reference);
    leftHtml += `</p>`;

    rightHtml += `<p class="verse" data-sec="${sec}">`;
    rightHtml += `<span class="verse-num">${sec}</span> `;
    rightHtml += parseSN(targetSN);
    rightHtml += `<span class="confidence ${cls}">${pct}%</span>${modelTag}`;
    rightHtml += `<span class="lcc-original">${escHtml(targetOrig)}</span>`;
    rightHtml += `</p>`;
  }

  leftContent.innerHTML = leftHtml;
  rightContent.innerHTML = rightHtml;

  attachSNHandlers();
  attachVerseClickHandlers(data);
  attachScrollSync();

  selectedVerseSec = null;
  notesContent.innerHTML = `<em>${t('noVerse')}</em>`;
  document.getElementById('reviews-list').innerHTML = '';
  document.getElementById('review-verse-ref').textContent = '\u2014';
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── SN Highlighting ──────────────────────────────────────────────────────

function attachSNHandlers() {
  document.querySelectorAll('.sn').forEach(el => {
    el.addEventListener('mouseenter', () => highlightSN(el.dataset.strong, true));
    el.addEventListener('mouseleave', () => highlightSN(el.dataset.strong, false));
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const on = !el.classList.contains('highlight-sticky');
      clearStickyHighlights();
      if (on) {
        document.querySelectorAll(`.sn[data-strong="${el.dataset.strong}"]`)
          .forEach(s => { s.classList.add('highlight', 'highlight-sticky'); });
      }
    });
  });
}

function highlightSN(strong, on) {
  if (document.querySelector('.sn.highlight-sticky')) return;
  document.querySelectorAll(`.sn[data-strong="${strong}"]`)
    .forEach(s => s.classList.toggle('highlight', on));
}

function clearStickyHighlights() {
  document.querySelectorAll('.sn.highlight-sticky').forEach(s => {
    s.classList.remove('highlight', 'highlight-sticky');
  });
}

// ── Verse Click → Notes + Reviews ───────────────────────────────────────

function attachVerseClickHandlers(data) {
  const dataMap = {};
  data.forEach(v => { dataMap[v.sec] = v; });

  document.querySelectorAll('.verse[data-sec]').forEach(el => {
    el.addEventListener('click', () => {
      const sec = parseInt(el.dataset.sec);
      const v = dataMap[sec];
      if (!v) return;

      document.querySelectorAll('.verse.selected').forEach(s => s.classList.remove('selected'));
      document.querySelectorAll(`.verse[data-sec="${sec}"]`).forEach(s => s.classList.add('selected'));

      clearStickyHighlights();
      selectedVerseSec = sec;

      // Update review bar verse reference
      const info = bookMap[currentBook];
      const label = info ? (lang.startsWith('zh') ? info.chiLong : info.engLong) || info.eng : currentBook;
      document.getElementById('review-verse-ref').textContent = `${label} ${currentChap}:${sec}`;

      // AI notes
      if (v.notes && v.notes.length > 0) {
        notesContent.innerHTML = v.notes.map(n =>
          `<div class="note">${escHtml(n)}</div>`
        ).join('');
      } else {
        notesContent.innerHTML = `<em>${t('noNotes')}</em>`;
      }

      // Reviews
      showVerseReviews(currentBook, parseInt(currentChap), sec);

      document.getElementById('notes-panel').open = true;
    });
  });
}

// ── Scroll Sync ──────────────────────────────────────────────────────────

function attachScrollSync() {
  let syncing = false;
  function syncScroll(source, target) {
    if (syncing) return;
    syncing = true;
    const ratio = source.scrollTop / (source.scrollHeight - source.clientHeight || 1);
    target.scrollTop = ratio * (target.scrollHeight - target.clientHeight || 1);
    syncing = false;
  }
  leftContent.addEventListener('scroll', () => syncScroll(leftContent, rightContent));
  rightContent.addEventListener('scroll', () => syncScroll(rightContent, leftContent));
}

// ── Resize Handle (panels ↔ notes) ──────────────────────────────────────

(function initResizeHandle() {
  const handle = document.getElementById('resize-handle');
  const panels = document.getElementById('panels');
  const notes  = document.getElementById('notes-panel');
  if (!handle || !panels || !notes) return;

  let dragging = false, startY = 0, startPanelsH = 0, startNotesH = 0;

  handle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    dragging = true;
    startY = e.clientY;
    startPanelsH = panels.getBoundingClientRect().height;
    startNotesH  = notes.getBoundingClientRect().height;
    document.body.style.cursor = 'ns-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    e.preventDefault();
    const dy = e.clientY - startY;
    const newPanelsH = Math.max(120, startPanelsH + dy);
    const newNotesH  = Math.max(60,  startNotesH  - dy);
    panels.style.flex = 'none';
    panels.style.height = newPanelsH + 'px';
    notes.style.height  = newNotesH  + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });

  // Touch support
  handle.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    dragging = true;
    startY = t.clientY;
    startPanelsH = panels.getBoundingClientRect().height;
    startNotesH  = notes.getBoundingClientRect().height;
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    const t = e.touches[0];
    const dy = t.clientY - startY;
    const newPanelsH = Math.max(120, startPanelsH + dy);
    const newNotesH  = Math.max(60,  startNotesH  - dy);
    panels.style.flex = 'none';
    panels.style.height = newPanelsH + 'px';
    notes.style.height  = newNotesH  + 'px';
  }, { passive: true });

  document.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
  });
})();

// ── Go ───────────────────────────────────────────────────────────────────
init();
</script>
