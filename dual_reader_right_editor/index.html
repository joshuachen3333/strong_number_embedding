<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual Bible Reader</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header-container" style="display: flex; justify-content: center; align-items: center; margin: 10px 0;">
        <h1 style="margin: 0; flex-grow: 1; text-align: center;">Dual Synchronized Bible Reader</h1>
        <div class="language-selector" style="margin-left: 20px;">
            <label for="language" title="Select interface language">Language:</label>
            <select id="language" title="Choose interface language">
                <option value="en">English</option>
                <option value="zh">正體中文</option>
            </select>
        </div>
    </div>

    <div class="container">
        <div id="left-reader-component-container">
            <!-- Left Reader HTML will be injected here by left_reader_frontend.js,
                 or defined directly if preferred for static parts -->
            <div id="left-reader-component">
                <div class="reader-controls">
                    <div class="control-line-1" style="margin-bottom: 8px;">
                        <label for="left-reader-version-select" title="Select Bible version">Ver:</label>
                        <select id="left-reader-version-select" style="margin-right: 15px;" title="Choose Bible version for left reader">
                            <option value="unv">UNV (Union Version)</option>
                            <option value="kjv">KJV (King James Version)</option>
                            <option value="esv">ESV (English Standard Version)</option>
                            <option value="rcuv2010">和合本2010</option>
                            <option value="lcc">呂振中譯本</option>
                        </select>
                        <label for="left-reader-book" title="Select Bible book">BK:</label>
                        <select id="left-reader-book" style="margin-right: 15px;" title="Choose Bible book for left reader"></select>
                        <label for="left-reader-chapter" title="Select chapter number">Cptr:</label>
                        <input type="number" id="left-reader-chapter" value="1" min="1" style="width: 60px;" title="Enter chapter number">
                    </div>
                    <div class="control-line-2">
                        <input type="checkbox" id="left-reader-strong-toggle" title="Toggle Strong's Numbers display">
                        <label for="left-reader-strong-toggle" style="margin-right: 15px;" title="Show/hide Strong's Numbers">SN</label>
                        <input type="checkbox" id="left-reader-follow-selection" title="Follow right reader's text selection changes">
                        <label for="left-reader-follow-selection" style="margin-right: 15px;" title="Follow text selection from right reader">FL TxT Sel</label>
                        <input type="checkbox" id="left-reader-follow-scroll" title="Follow right reader's verse scrolling">
                        <label for="left-reader-follow-scroll" title="Follow verse scroll from right reader">FL Ver Scrl</label>
                    </div>
                    <div class="control-line-3" id="left-reader-strong-controls" style="margin-top: 8px;">
                        <input type="checkbox" id="left-reader-highlight-mode" checked title="Single highlight mode: show only nearest Strong's position">
                        <label for="left-reader-highlight-mode" style="margin-right: 15px;" title="Single highlight mode: highlight only nearest Strong's position instead of all occurrences">Single HL</label>
                        <input type="checkbox" id="left-reader-hl-ver" title="Highlight matched verse background">
                        <label for="left-reader-hl-ver" style="margin-right: 15px;" title="Enable verse background highlighting for matched content">Ver HL</label>
                    </div>
                </div>
                <div id="left-reader-content-area" class="reader-content resizable" style="width: 100%; height: 400px; border: 1px solid #ccc; overflow-y: auto; resize: none; position: relative;">
                    <p>Loading content...</p>
                    <div class="resize-handle-se"></div>
                </div>
                <div class="resize-handle-s" data-target="left-content" style="position: relative; margin: 0 auto; width: 80px;"></div>
                <div id="left-reader-status-display" class="status-area resizable-height" style="margin-top: 10px; padding: 5px; border: 1px solid #ccc; font-size: 0.9em; word-wrap: break-word; height: 60px; overflow-y: auto; background: #f9f9f9; position: relative;">
                    <div><strong>Left Reader Status:</strong></div>
                    <div>Ready...</div>
                </div>
                <div class="resize-handle-s" data-target="left-status" style="position: relative; margin: 0 auto; width: 80px;"></div>
            </div>
        </div>

        <div id="right-reader-component-container">
            <!-- Right Reader HTML will be injected here by right_reader_frontend.js,
                 or defined directly -->
            <div id="right-reader-component">
                <div class="reader-controls">
                    <div class="control-line-1" style="margin-bottom: 8px;">
                        <label for="right-reader-version-select" title="Select Bible version">Ver:</label>
                        <select id="right-reader-version-select" style="margin-right: 15px;" title="Choose Bible version for right reader">
                            <option value="unv">UNV (Union Version)</option>
                            <option value="kjv">KJV (King James Version)</option>
                            <option value="esv">ESV (English Standard Version)</option>
                            <option value="rcuv2010">和合本2010</option>
                            <option value="lcc">呂振中譯本</option>
                        </select>
                        <label for="right-reader-book" title="Select Bible book">BK:</label>
                        <select id="right-reader-book" style="margin-right: 15px;" title="Choose Bible book for right reader"></select>
                        <label for="right-reader-chapter" title="Select chapter number">Cptr:</label>
                        <input type="number" id="right-reader-chapter" value="1" min="1" style="width: 60px;" title="Enter chapter number">
                    </div>
                    <div class="control-line-2">
                        <input type="checkbox" id="right-reader-strong-toggle" checked title="Toggle Strong's Numbers display">
                        <label for="right-reader-strong-toggle" style="margin-right: 15px;" title="Show/hide Strong's Numbers">SN</label>
                        <input type="checkbox" id="right-reader-follow-selection" title="Follow left reader's text selection changes">
                        <label for="right-reader-follow-selection" style="margin-right: 15px;" title="Follow text selection from left reader">FL TxT Sel</label>
                        <input type="checkbox" id="right-reader-follow-scroll" title="Follow left reader's verse scrolling">
                        <label for="right-reader-follow-scroll" style="margin-right: 15px;" title="Follow verse scroll from left reader">FL Ver Scrl</label>
                        <input type="checkbox" id="right-reader-edit-mode" checked title="Enable editing mode for inserting Strong's Numbers">
                        <label for="right-reader-edit-mode" title="Toggle edit mode for Strong's Number insertion">Edit</label>
                    </div>
                    <div class="control-line-3" id="right-reader-strong-controls" style="margin-top: 8px; display: none;">
                        <span style="font-size: 0.9em; margin-right: 10px;" title="Strong's Number input field">SN cpd:</span>
                        <input type="text" id="strong-number-input" placeholder="H1234 or G5678" style="width: 100px; margin-right: 10px;" title="Enter Strong's Number (e.g., H1234 or G5678) and press Enter to insert">
                        <input type="checkbox" id="right-reader-hl-ver" title="Highlight matched verse background">
                        <label for="right-reader-hl-ver" title="Enable verse background highlighting for matched content">Ver HL</label>
                    </div>
                </div>
                <div id="right-reader-content-area" class="reader-content resizable" style="width: 100%; height: 400px; border: 1px solid #ccc; overflow-y: auto; resize: none; position: relative;">
                    <p>Waiting for left reader...</p>
                    <div class="resize-handle-se"></div>
                </div>
                <div class="resize-handle-s" data-target="right-content" style="position: relative; margin: 0 auto; width: 80px;"></div>
                <div id="right-reader-status-display" class="status-area resizable-height" style="margin-top: 10px; padding: 5px; border: 1px solid #ccc; font-size: 0.9em; word-wrap: break-word; height: 60px; overflow-y: auto; background: #f9f9f9; position: relative;">
                    <div><strong>Right Reader Status:</strong></div>
                    <div>Waiting for left reader...</div>
                </div>
                <div class="resize-handle-s" data-target="right-status" style="position: relative; margin: 0 auto; width: 80px;"></div>
            </div>
        </div>
    </div>

    <!-- Debug Controls -->
    <div style="margin: 20px; padding: 10px;">
        <label for="debug-toggle" title="Toggle debug console output for development">
            <input type="checkbox" id="debug-toggle" title="Show/hide debug console output"> Show Debug Output
        </label>
        <label for="status-toggle" style="margin-left: 20px;" title="Toggle status display areas">
            <input type="checkbox" id="status-toggle" checked title="Show/hide status information areas"> Show Status
        </label>
    </div>

    <!-- Debug Output Area -->
    <div id="debug-output" class="resizable-height" style="margin: 20px; padding: 10px; background: #f0f0f0; border: 1px solid #ccc; font-family: monospace; font-size: 12px; height: 60px; overflow-y: auto; display: none; position: relative;">
        <h4>Debug Output:</h4>
        <div id="debug-content">Ready for debugging...</div>
        <div class="resize-handle-s"></div>
    </div>

    <script src="js/mock_mediator.js"></script>
    <script src="js/left_reader_frontend.js"></script>
    <script src="js/right_reader_frontend.js"></script>
    <script src="js/highlighting_foundation.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
