<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hebrew Alphabet Cards | 希伯來字母卡</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Overview Page -->
    <div id="overview-page" class="page active">
        <h1>אָלֶף־בֵּית <span class="subtitle">希伯來字母表</span></h1>
        <p class="hint">點擊字母進入學習 | Click a letter to study</p>
        <div id="letter-grid" class="letter-grid">
            <!-- Generated by JS -->
        </div>
        <div class="legend">
            <span class="legend-item"><span class="badge badge-f">F</span> 有字尾形 Final form</span>
            <span class="legend-item"><span class="badge badge-v">V</span> 可作母音 Vowel use</span>
        </div>
    </div>

    <!-- Card Page -->
    <div id="card-page" class="page">
        <nav class="card-nav">
            <button id="btn-back" class="nav-btn" title="返回總覽 (↑)">
                <span class="arrow">↑</span> 總覽
            </button>
            <div class="nav-center">
                <button id="btn-prev" class="nav-btn" title="上一個 (←)">
                    <span class="arrow">←</span>
                </button>
                <span id="letter-position" class="position-indicator">1 / 22</span>
                <button id="btn-next" class="nav-btn" title="下一個 (→)">
                    <span class="arrow">→</span>
                </button>
            </div>
            <button id="btn-print" class="nav-btn" title="列印模式 (P)">
                <span class="icon">🖨</span> 列印
            </button>
        </nav>

        <div class="card-container">
            <!-- Left: Letter Display -->
            <div class="card-main">
                <div class="letter-display">
                    <div id="current-letter" class="big-letter">א</div>
                    <div class="letter-name-row">
                        <div id="letter-name" class="letter-name">Aleph</div>
                        <label class="romanization-checkbox" title="加上羅馬拼音的發音">
                            <input type="checkbox" id="romanization-toggle" checked>
                            <span class="romanization-text">羅馬發音</span>
                        </label>
                    </div>
                    <div id="letter-sound" class="letter-sound">silent / glottal stop</div>
                </div>

                <!-- Form Indicators -->
                <div id="form-indicators" class="form-indicators">
                    <button id="btn-base" class="form-btn active" title="基本形 (Space)">
                        基本
                    </button>
                    <button id="btn-final" class="form-btn hidden" title="字尾形 (F)">
                        <span class="badge badge-f">F</span> 字尾形
                    </button>
                    <button id="btn-vowel" class="form-btn hidden" title="母音形 (V)">
                        <span class="badge badge-v">V</span> 母音
                    </button>
                </div>

                <!-- Controls -->
                <div class="controls">
                    <div class="control-group">
                        <button id="btn-stroke" class="control-btn">
                            <span class="icon">✍</span> 筆順動畫
                        </button>
                        <label class="toggle-switch" title="自動播放筆順 Auto-play stroke">
                            <input type="checkbox" id="auto-stroke-toggle" checked>
                            <span class="toggle-slider"></span>
                            <span class="toggle-label">自動</span>
                        </label>
                    </div>
                    <div class="control-group">
                        <button id="btn-audio" class="control-btn">
                            <span class="icon">🔊</span> 發音
                        </button>
                        <label class="toggle-switch" title="自動發音 Auto-play audio">
                            <input type="checkbox" id="auto-audio-toggle">
                            <span class="toggle-slider"></span>
                            <span class="toggle-label">自動</span>
                        </label>
                    </div>
                </div>

                <!-- Stroke Animation Area -->
                <div id="stroke-area" class="stroke-area">
                    <svg id="stroke-svg" viewBox="0 0 200 200" class="stroke-svg">
                        <!-- Stroke paths rendered here -->
                    </svg>
                </div>
            </div>

            <!-- Right: Examples -->
            <div class="card-examples">
                <h3 id="examples-header">例字 Examples</h3>
                <div id="example-list" class="example-list">
                    <!-- Generated by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Print Page -->
    <div id="print-page" class="page print-page">
        <div id="print-letter" class="print-letter">א</div>
        <div id="print-name" class="print-name">Aleph</div>
        <p class="print-hint">按 P 或 ESC 返回 | Press P or ESC to return</p>
    </div>

    <!-- Keyboard Hints -->
    <div id="keyboard-hints" class="keyboard-hints">
        <span>← → 切換字母</span>
        <span>↑ 總覽</span>
        <span>Space 基本形</span>
        <span>F 切換字尾形</span>
        <span>V 切換母音形</span>
        <span>S 筆順</span>
        <span>A 發音</span>
        <span>P 列印</span>
    </div>

    <script src="js/letter_data.js"></script>
    <script src="js/stroke_paths.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
