<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parsed Verse Viewer v2 — UNV+SN</title>
  <link rel="stylesheet" href="css/styles.css?v=20251211A">
</head>
<body>
  <!-- Header -->
  <header class="viewer-header">
    <div class="header-left">
      <select id="book-select" class="book-select">
        <option value="">選擇書卷...</option>
      </select>
      <select id="chapter-select" class="chapter-select">
        <option value="">選擇章...</option>
      </select>
    </div>

    <div class="header-center">
      <h1>Parsed Verse Viewer v2</h1>
    </div>

    <div class="header-right">
      <input type="checkbox" id="sn-dict-toggle">
      <label for="sn-dict-toggle" title="Enable Strong's Number Dictionary Tooltip">SN Dict</label>
    </div>
  </header>

  <!-- Main Content -->
  <main class="viewer-main">
    <!-- Left Panel: UNV Reader -->
    <section class="left-panel">
      <div class="panel-header">
        <div class="panel-header-left">
          <h2>UNV+SN Text</h2>
          <div id="left-verse-ref" class="verse-ref-display" style="display: none;"></div>
        </div>
        <div class="panel-controls">
          <input type="checkbox" id="single-highlight-mode" checked>
          <label for="single-highlight-mode">Single HL</label>
        </div>
      </div>
      <div id="left-content" class="panel-content">
        <div class="loading-message">請選擇書卷和章節...</div>
      </div>
    </section>

    <!-- Right Panel: Parsed Output -->
    <section class="right-panel">
      <div class="panel-header">
        <div class="panel-header-left">
          <h2>Parsed Output</h2>
          <div id="verse-ref-display" class="verse-ref-display" style="display: none;"></div>
        </div>
        <div class="panel-header-right">
          <div id="uncertain-badge" class="uncertain-badge" style="display: none;">
            ⚠️ Uncertain
          </div>
          <button id="toggle-parsed" class="toggle-btn active" title="Show/hide Parsed Text section">Parsed</button>
          <button id="toggle-raw" class="toggle-btn" title="Show/hide Raw UNV+SN section">Raw</button>
          <button id="toggle-notes" class="toggle-btn" title="Show/hide Morphology Notes section">Notes</button>
        </div>
      </div>
      <div id="right-content" class="panel-content">
        <div class="loading-message">請點擊左側節次以查看解析結果...</div>
      </div>
    </section>
  </main>

  <!-- Scripts - IMPORTANT: Load order matters! -->
  <!-- 1. Core utilities first -->
  <script src="js/mediator.js"></script>
  <script src="js/ui_utils.js"></script>
  <script src="js/book_data.js"></script>

  <!-- 2. Service layer -->
  <script src="js/data_loader.js?v=20251209D"></script>
  <script src="js/color_mapper.js?v=20251209D"></script>
  <script src="js/sn_dictionary.js?v=20251209N"></script>

  <!-- 3. UI components -->
  <script src="js/left_panel.js?v=20251209M"></script>
  <script src="js/right_panel.js?v=20251209N"></script>
  <script src="js/navigation.js?v=20251209J"></script>

  <!-- 4. App controller last -->
  <script src="js/app.js"></script>
</body>
</html>
