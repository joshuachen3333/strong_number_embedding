<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parsed Verse Viewer v2 — UNV+SN</title>
  <link rel="stylesheet" href="css/styles.css?v=20251215A">
</head>
<body>
  <!-- Header -->
  <header class="viewer-header">
    <div class="header-left">
      <select id="book-select" class="book-select">
        <option value="">選擇書卷...</option>
      </select>
      <select id="chapter-select" class="chapter-select">
        <option value="">選擇章...</option>
      </select>
    </div>

    <div class="header-center">
      <h1>Parsed Verse Viewer v2</h1>
    </div>

    <div class="header-right">
      <!-- Global SN Dict removed - now panel-specific -->
    </div>
  </header>

  <!-- Main Content -->
  <main class="viewer-main">
    <!-- Left Panel: UNV/KJV Reader -->
    <section class="left-panel">
      <div class="panel-header">
        <div class="panel-header-left">
          <div id="left-verse-ref" class="verse-ref-display" style="display: none;"></div>
        </div>
        <div class="panel-controls">
          <!-- UNV Controls (blue) - visible when UNV toggle is active -->
          <span class="unv-controls" style="display: none;">
            <input type="checkbox" id="unv-sn-dict-toggle">
            <label for="unv-sn-dict-toggle" class="unv-label" title="Enable Strong's Number Dictionary Tooltip for UNV">SN Dict</label>
            <input type="checkbox" id="unv-single-hl-mode" checked>
            <label for="unv-single-hl-mode" class="unv-label" title="Clear previous highlights when clicking new SN in UNV">Single HL</label>
          </span>
          <!-- KJV Controls (teal) - visible when KJV toggle is active -->
          <span class="kjv-controls" style="display: none;">
            <input type="checkbox" id="kjv-sn-dict-toggle">
            <label for="kjv-sn-dict-toggle" class="kjv-label" title="Enable Strong's Number Dictionary Tooltip for KJV">SN Dict</label>
            <input type="checkbox" id="kjv-single-hl-mode" checked>
            <label for="kjv-single-hl-mode" class="kjv-label" title="Clear previous highlights when clicking new SN in KJV">Single HL</label>
          </span>
          <!-- Version Toggle Buttons -->
          <button id="toggle-unv" class="toggle-btn version-toggle unv active" title="Show/hide UNV (和合本) text">UNV</button>
          <button id="toggle-kjv" class="toggle-btn version-toggle kjv" title="Show/hide KJV (King James Version) text">KJV</button>
        </div>
      </div>
      <div id="left-content" class="panel-content">
        <!-- UNV Content Section -->
        <div id="unv-content" class="version-content unv-section">
          <div class="loading-message">請選擇書卷和章節...</div>
        </div>
        <!-- KJV Content Section -->
        <div id="kjv-content" class="version-content kjv-section" style="display: none;">
          <div class="loading-message">Loading KJV...</div>
        </div>
      </div>
    </section>

    <!-- Right Panel: Parsed Output -->
    <section class="right-panel">
      <div class="panel-header">
        <div class="panel-header-left">
          <h2>Parsed Output</h2>
          <div id="verse-ref-display" class="verse-ref-display" style="display: none;"></div>
        </div>
        <div class="panel-header-right">
          <div id="uncertain-badge" class="uncertain-badge" style="display: none;">
            ⚠️ Uncertain
          </div>
          <input type="checkbox" id="right-sn-dict-toggle">
          <label for="right-sn-dict-toggle" title="Enable Strong's Number Dictionary Tooltip for right panel">SN Dict</label>
          <input type="checkbox" id="toggle-spec">
          <label for="toggle-spec" title="Enable spec tooltips on [3.x.x] references">Spec</label>
          <input type="checkbox" id="right-single-highlight-mode" checked>
          <label for="right-single-highlight-mode" title="Clear previous highlights when clicking new SN">Single HL</label>
          <button id="toggle-parsed" class="toggle-btn active" title="Show/hide Parsed Text section">Parsed</button>
          <button id="toggle-raw" class="toggle-btn" title="Show/hide Raw UNV+SN section">Raw</button>
          <button id="toggle-notes" class="toggle-btn" title="Show/hide Morphology Notes section">Notes</button>
        </div>
      </div>
      <div id="right-content" class="panel-content">
        <div class="loading-message">請點擊左側節次以查看解析結果...</div>
      </div>
    </section>
  </main>

  <!-- Scripts - IMPORTANT: Load order matters! -->
  <!-- 1. Core utilities first -->
  <script src="js/mediator.js"></script>
  <script src="js/ui_utils.js"></script>
  <script src="js/book_data.js"></script>

  <!-- 2. Service layer -->
  <script src="js/data_loader.js?v=20251209D"></script>
  <script src="js/color_mapper.js?v=20251214C"></script>
  <script src="js/sn_dictionary.js?v=20251214A"></script>

  <!-- 3. UI components -->
  <script src="js/left_panel.js?v=20251215A"></script>
  <script src="js/right_panel.js?v=20251214C"></script>
  <script src="js/navigation.js?v=20251212A"></script>

  <!-- 4. App controller last -->
  <script src="js/app.js"></script>
</body>
</html>
